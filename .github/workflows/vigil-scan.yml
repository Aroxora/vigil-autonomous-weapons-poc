# ───────────────────────────────────────────────
# Vigil CNE — GitHub Actions Security Pipeline
# Run on every push & PR. Find vulnerabilities
# before they merge. No jailbreak required.
# ───────────────────────────────────────────────
name: Vigil CNE Security Scan

on:
  push:
    branches: [main, master, develop]
    paths-ignore: ['*.md', 'docs/**']
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * *'      # Daily 06:00 UTC
  workflow_dispatch:          # Manual trigger
    inputs:
      deep_scan:
        description: 'Run deep binary analysis (Ghidra)'
        type: boolean
        default: false
      kali_tools:
        description: 'Enable Kali tool probes'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  vigil-scan:
    name: Vigil CNE — Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Vigil
        run: npm ci --legacy-peer-deps || npm install

      - name: Build Vigil
        run: npm run build || true

      - name: Vigil — Full Security Pipeline
        env:
          VIGIL_SESSION_TOKEN: ${{ github.run_id }}
          VIGIL_CI_MODE: 'true'
          VIGIL_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::group::1/6 Dependency Audit"
          node scripts/vigil-run.mjs scripts/security-analysis.mjs --local || true
          echo "::endgroup::"

          echo "::group::2/6 Secret & Credential Scan"
          node scripts/vigil-run.mjs scripts/_secret-scan.mjs || true
          echo "::endgroup::"

          echo "::group::3/6 Binary Hardening (checksec + readelf)"
          node scripts/vigil-run.mjs scripts/_ghidra-headless.mjs --probe || true
          echo "::endgroup::"

          echo "::group::4/6 CISA KEV & EPSS Enrichment"
          node scripts/vigil-run.mjs scripts/_kev-monitor.mjs --top 50 || true
          echo "::endgroup::"

          echo "::group::5/6 Comprehensive Vulnerability Scan"
          node scripts/vigil-run.mjs scripts/_vigil-comprehensive.mjs || true
          echo "::endgroup::"

          echo "::group::6/6 PoC Auto-Verdict Engine"
          node scripts/vigil-run.mjs scripts/_poc-engine.mjs || true
          echo "::endgroup::"

      - name: Publish Findings Summary
        if: always()
        run: |
          echo "# Vigil CNE Security Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Summary from latest comprehensive scan
          LATEST_DIR=$(ls -dt security-analysis/vigil-comprehensive-* 2>/dev/null | head -1)
          if [ -n "$LATEST_DIR" ] && [ -f "$LATEST_DIR/comprehensive-summary.md" ]; then
            cat "$LATEST_DIR/comprehensive-summary.md" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** \`${{ github.run_id }}\` | **Branch:** \`${{ github.ref_name }}\` | **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload Security Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vigil-security-findings
          path: |
            security-analysis/*/comprehensive-findings.json
            security-analysis/*/comprehensive-summary.md
            security-analysis/*/eccn-registry.json
            security-analysis/*/validators/
            security-analysis/*/vulnerabilities.json
          retention-days: 90

      - name: Create Issue for Critical Findings
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_DIR=$(ls -dt security-analysis/vigil-comprehensive-* 2>/dev/null | head -1)
          if [ -z "$LATEST_DIR" ]; then exit 0; fi

          FINDINGS="$LATEST_DIR/comprehensive-findings.json"
          if [ ! -f "$FINDINGS" ]; then exit 0; fi

          # Count critical + high from JSON
          CRIT=$(node -e "const f=require('./$FINDINGS'); console.log(f.summary?.bySeverity?.critical || 0)")
          HIGH=$(node -e "const f=require('./$FINDINGS'); console.log(f.summary?.bySeverity?.high || 0)")
          TOTAL=$(node -e "const f=require('./$FINDINGS'); console.log(f.summary?.totalFindings || 0)")
          KEVM=$(node -e "const f=require('./$FINDINGS'); console.log(f.summary?.cisaKevMatches || 0)")

          if [ "$CRIT" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            gh issue create \
              --title "Vigil: $CRIT critical, $HIGH high-risk findings — $KEVM KEV matches" \
              --body "## Vigil CNE Scan — $TOTAL findings

          - **$CRIT critical** | **$HIGH high** | **$KEVM** CISA KEV matches
          - Branch: \`${{ github.ref_name }}\`
          - Commit: \`${{ github.sha }}\`
          - [View full report in artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

          Full details: \`$FINDINGS\`" \
              --label "security,automated,vigil" \
              --assignee "${{ github.actor }}" || true
          fi

      - name: Slack / Discord Alert (Critical Only)
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          LATEST_DIR=$(ls -dt security-analysis/vigil-comprehensive-* 2>/dev/null | head -1)
          if [ -z "$LATEST_DIR" ] || [ -z "$DISCORD_WEBHOOK" ]; then exit 0; fi

          CRIT=$(node -e "const f=require('./$LATEST_DIR/comprehensive-findings.json'); console.log(f.summary?.bySeverity?.critical || 0)")
          if [ "$CRIT" -eq 0 ]; then exit 0; fi

          curl -sS -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"**Vigil CNE Alert** — $CRIT critical findings in \`${{ github.repository }}\`\\nBranch: \`${{ github.ref_name }}\`\\nCommit: \`${{ github.sha }}\`\\n[View Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\"}" || true
