name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --legacy-peer-deps
      - run: npm run type-check || true
      - run: npm run lint -- --max-warnings 0 || true
      - run: npm run build || true
      - run: npm test -- --ci --passWithNoTests || true
      - run: npm run health:json || true
      - name: Upload health artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: health-report
          path: |
            site/vigil-web/public/health.json
            site/vigil-web/public/status.json
          retention-days: 7

  health-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --legacy-peer-deps
      - run: npm run health:json || true
      - name: Upload health
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-health
          path: site/vigil-web/public/health.json
